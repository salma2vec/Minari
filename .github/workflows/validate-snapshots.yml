name: Validate collected transition snapshots
on:
  push:
    branches: [codex/validate-minari-lint]
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fa5f36c6b350a4eec91cbd8d86cfcca1805d181c
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
