name: Validate collected transition snapshots
on:
  push:
    branches: [codex/validate-minari-final]
permissions:
  contents: read
jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - name: Build the upstream native test image
        run: docker build -f bin/Dockerfile --build-arg PYTHON_VERSION=${{ matrix.python }} --tag minari-tests .
      - name: Full native suite on the fix
        shell: bash
        run: |
          mkdir -p reports
          set +e
          docker run --rm -v "$PWD/reports:/reports" minari-tests pytest tests/ -k "not test_docs.py and not integrations" --junitxml=/reports/full-after.xml -q > reports/full-after.log 2>&1
          result=$?
          echo "$result" > reports/full-after.exit
          cat reports/full-after.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.python }}
          path: reports
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 12fa51272effd18eb2ef101524b9d6e642b8b40c
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
